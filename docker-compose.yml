services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fato_unb
      POSTGRES_USER: fato_user
      POSTGRES_PASSWORD: fato_password
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fato_user -d fato_unb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    env_file:
      - .env
    environment:
      # Dentro do Docker os serviços se enxergam pelo nome, não por "localhost":
      # isso sobrescreve o que estiver no .env só pra esses dois.
      QDRANT_HOST: qdrant
      DATABASE_URL: postgresql+asyncpg://fato_user:fato_password@postgres:5432/fato_unb
      # Evita que o cache do modelo de embedding (2+ GB) vá para /tmp (às vezes é RAM) e
      # dobre o uso de memória. Fica no volume persistente abaixo, sobrevive a reinícios.
      FASTEMBED_CACHE_PATH: /root/.cache/fastembed
    volumes:
      - fastembed_cache:/root/.cache/fastembed
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fastembed_cache:
