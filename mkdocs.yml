site_name: FatoUnB - Documentação Técnica
site_description: Sistema automatizado de fact-checking e combate a boatos na Universidade de Brasília criado para a disciplina de Sistemas de Machine Learning 2026.2.
site_author: Equipe Accio
repo_url: https://github.com/unb-Sistemas-de-Machine-learning/challenge_1_accio
repo_name: challenge_1_accio

# Planos e specs internos de desenvolvimento não entram no site
exclude_docs: |
  superpowers/

theme:
  name: material
  language: pt-BR
  logo: assets/logo.jpeg
  favicon: assets/logo.jpeg
  palette:
    # Modo Escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
    # Modo Claro
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.tabs
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: [round]
      block_syntax: [square]
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Início:
    - Visão Geral: index.md
    - Como Executar: execucao.md
    - Guiding Questions: guiding_questions.md
  - Módulos:
    - Coleta de Dados: modulos/01-coleta-dados.md
    - Banco Vetorial e Staging: modulos/02-banco-vetorial.md
    - Pipeline RAG: modulos/03-pipeline-rag.md
    - Checagem com LLM e Guardrails: modulos/06-checagem-llm.md
    - Bot do Telegram e Privacidade: modulos/07-bot-telegram.md
    - Infra e Modelos: modulos/04-infra-modelos-local.md
  - Avaliação:
    - Métricas e Benchmark: modulos/05-metricas-benchmark.md
    - Dataset de Teste: modulos/avaliacao/dataset-teste.md
    - Avaliação do RAG: modulos/avaliacao/avaliacao-rag.md
    - Nuvem vs. Local: modulos/avaliacao/comparacao-nuvem-local.md
    - Resultados Finais: modulos/avaliacao/resultados-finais.md
  - Referência da API:
    - referencia/index.md
    - Ingestão: referencia/ingestion.md
    - Staging: referencia/storage.md
    - Banco Vetorial: referencia/vectorstore.md
    - RAG: referencia/rag.md
    - LLM: referencia/llm.md
    - Bot: referencia/bots.md
