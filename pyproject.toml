[project]
name = "challenge-1-accio"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "aiosqlite>=0.20.0",
    "anthropic>=1.9.0",
    "apscheduler>=3.11.3",
    "asyncpg>=0.30.0",
    "babel==2.18.0",
    "backrefs==8.0",
    "beautifulsoup4>=4.15.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "click==8.4.2",
    "colorama==0.4.6",
    "dotenv>=0.9.9",
    "fastembed>=0.8.0",
    "feedparser>=6.0.14",
    "ghp-import==2.1.0",
    "google-genai>=2.25.0",
    "greenlet>=3.5.6",
    "idna==3.19",
    "jinja2==3.1.6",
    "markdown==3.10.3",
    "markupsafe==3.0.3",
    "mergedeep==1.3.4",
    "mkdocs==1.6.1",
    "mkdocs-autorefs==1.4.4",
    "mkdocs-get-deps==0.2.2",
    "mkdocs-material==9.7.7",
    "mkdocs-material-extensions==1.3.1",
    "mkdocstrings==1.0.6",
    "mkdocstrings-python==2.0.7",
    "packaging==26.3",
    "paginate==0.5.7",
    "pathspec==1.1.1",
    "platformdirs==4.11.4",
    "pydantic>=2.13.4",
    "pygments==2.21.0",
    "pymdown-extensions==11.0.2",
    "pymupdf>=1.26.0",
    "pytest>=9.1.1",
    "python-dateutil==2.9.0.post0",
    "python-telegram-bot>=22.8",
    "pyyaml==6.0.3",
    "pyyaml-env-tag==1.1",
    "qdrant-client>=1.19.0",
    "requests==2.34.2",
    "six==1.17.0",
    "sqlalchemy>=2.0.0",
    "trafilatura>=2.2.0",
    "urllib3==2.7.0",
    "watchdog==6.0.0",
]

[project.optional-dependencies]
# Só usado por src/fato_unb/evaluation/generateTestset.py. Pesado (langchain, pandas,
# ragas) e o ragas precisa compilar scikit-network no Windows (exige Visual C++ Build
# Tools). Fora do grupo padrão para não travar quem só roda o bot/pipeline.
# Instalar com: uv sync --extra evaluation
evaluation = [
    "datasets>=3.0.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0,<0.4.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=4.4.0",
    "langchain-huggingface>=1.2.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "loguru==0.7.3",
    "pandas>=3.0.5",
    "ragas>=0.2.0",
    "rapidfuzz>=3.14.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings>=1.0.6",
    "mkdocstrings-python>=2.0.7",
]
