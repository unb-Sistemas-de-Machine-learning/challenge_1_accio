[project]
name = "challenge-1-accio"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "babel==2.18.0",
    "backrefs==8.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "click==8.4.2",
    "colorama==0.4.6",
    "dotenv>=0.9.9",
    "fastembed>=0.8.0",
    "ghp-import==2.1.0",
    "idna==3.19",
    "jinja2==3.1.6",
    "markdown==3.10.3",
    "markupsafe==3.0.3",
    "mergedeep==1.3.4",
    "mkdocs==1.6.1",
    "mkdocs-get-deps==0.2.2",
    "mkdocs-material==9.7.7",
    "mkdocs-material-extensions==1.3.1",
    "packaging==26.3",
    "paginate==0.5.7",
    "pathspec==1.1.1",
    "platformdirs==4.11.4",
    "pydantic>=2.13.4",
    "pygments==2.21.0",
    "pymdown-extensions==11.0.2",
    "pytest>=9.1.1",
    "python-dateutil==2.9.0.post0",
    "pyyaml==6.0.3",
    "pyyaml-env-tag==1.1",
    "qdrant-client>=1.19.0",
    "requests==2.34.2",
    "six==1.17.0",
    "urllib3==2.7.0",
    "watchdog==6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings>=1.0.6",
    "mkdocstrings-python>=2.0.7",
]
